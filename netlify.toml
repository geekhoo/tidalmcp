# Netlify configuration for the tidalmcp site.
# Static: dist/ (MCP Apps widget). Functions: netlify/functions/server.mjs (the /mcp endpoint
# and OAuth broker, state persisted to Netlify Blobs — see src/core/blobs-store.mjs).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # These keys hold documented public defaults (./var, local, 3000, 127.0.0.1, the
  # loopback callback) that legitimately appear in .env.example and the docs. They
  # are not secrets; exclude them from secrets scanning so the scan stays useful
  # for the real credentials (TIDAL_CLIENT_SECRET, TOKEN_ENCRYPTION_KEY).
  SECRETS_SCAN_OMIT_KEYS = "DATA_DIR,LOCAL_PROFILE,PORT,LISTEN_HOST,OAUTH_REDIRECT_ALLOWLIST,ALLOWED_ORIGINS,WIDGET_DOMAIN"

[functions]
  node_bundler = "esbuild"

# Backup route registrations in TOML form. The rules that actually reach production are
# the dist/_redirects file generated by scripts/build.mjs (200! rewrites): these TOML
# rules were silently not processed, and config.path proved unreliable.
[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/server"
  status = 200
[[redirects]]
  from = "/healthz"
  to = "/.netlify/functions/server"
  status = 200
[[redirects]]
  from = "/register"
  to = "/.netlify/functions/server"
  status = 200
[[redirects]]
  from = "/authorize"
  to = "/.netlify/functions/server"
  status = 200
[[redirects]]
  from = "/consent"
  to = "/.netlify/functions/server"
  status = 200
[[redirects]]
  from = "/tidal/callback"
  to = "/.netlify/functions/server"
  status = 200
[[redirects]]
  from = "/token"
  to = "/.netlify/functions/server"
  status = 200
[[redirects]]
  from = "/revoke"
  to = "/.netlify/functions/server"
  status = 200
[[redirects]]
  from = "/.well-known/oauth-protected-resource"
  to = "/.netlify/functions/server"
  status = 200
[[redirects]]
  from = "/.well-known/oauth-protected-resource/mcp"
  to = "/.netlify/functions/server"
  status = 200
[[redirects]]
  from = "/.well-known/oauth-authorization-server"
  to = "/.netlify/functions/server"
  status = 200
